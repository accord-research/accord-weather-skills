name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run tools/sync_contract.py --check
      - run: uv run pytest -q -m "not integration"
      - name: Lint the skills with weather-skills-core
        run: uvx --from "git+https://github.com/rhiza-research/weather-skills-core@main" weather-skills-core lint skills --strict error
